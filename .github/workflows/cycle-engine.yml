# MOTEUR A — ping-pong avec « Cycle moteur relais » (B) :
# A se termine -> B démarre -> B se termine -> A démarre...
# (GitHub interdit qu'un workflow s'écoute lui-même : d'où le relais.)
# Le cron */5 reste en filet de sécurité si la chaîne s'interrompt.
name: Cycle moteur (cron gratuit)

on:
  schedule:
    - cron: "*/5 * * * *"   # un seul moteur, une seule base : zéro doublon
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: cycle-engine-a
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Récupérer le code (requis avant l'action locale)
        uses: actions/checkout@v4
      - uses: ./.github/actions/cycle
        with:
          telegram-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          telegram-chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
          confirm-once: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
